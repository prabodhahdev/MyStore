<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: page_head}">
</head>
<body>

<nav th:replace="~{layout :: page_navbar}">
</nav>

<div class="container py-3">
    <h1 class="text-center my-4">List of Clients</h1>
    <a class="btn btn-primary mb-3" href="/clients/create">Add Client</a>

    <div class="table-responsive">
        <table class="table table-striped table-bordered table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Created At</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="client : ${clients}">
                <td th:text="${client.id}"></td>
                <td th:text="${client.firstname + ' ' + client.lastname}"></td>
                <td th:text="${client.email}"></td>
                <td th:text="${client.phone}"></td>
                <td th:text="${client.address}"></td>
                <td th:text="${client.createdAt}"></td>
                <td>
                    <a class="btn btn-sm btn-primary me-1" th:href="@{/clients/edit(id=${client.id})}">Edit</a>
                    <a class="btn btn-sm btn-danger" th:href="@{/clients/delete(id=${client.id})}">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:replace="~{layout :: page_footer}">
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
